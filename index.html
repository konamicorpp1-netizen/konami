<!DOCTYPE html>
<html lang="ka" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOLKHA | Premium Gastronomy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+GO:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Fira GO', 'sans-serif'] }, colors: { brand: { gold: '#D4AF37', dark: '#050507' } } } }
        }
    </script>

    <style>
        body { background-color: #050507; color: #fff; overflow-x: hidden; }
        .ambient-light { pointer-events: none; position: absolute; border-radius: 50%; filter: blur(120px); z-index: -1; }
        .glass-nav { background: rgba(5, 5, 7, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .glass-panel { background: rgba(20, 20, 25, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-gold { background: linear-gradient(135deg, #D4AF37, #AA8620); color: #000; transition: 0.3s; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4); }
        .hero-parallax { background-image: linear-gradient(rgba(5,5,7,0.75), rgba(5,5,7,0.9)), url('https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=1920&auto=format&fit=crop'); background-size: cover; background-position: center; }
        .marquee { background-color: rgba(212, 175, 55, 0.05); border-top: 1px solid rgba(212, 175, 55, 0.1); border-bottom: 1px solid rgba(212, 175, 55, 0.1); overflow: hidden; white-space: nowrap; padding: 12px 0; }
        .marquee-content { display: inline-block; animation: marquee 25s linear infinite; }
        .marquee-item { margin: 0 30px; font-size: 1.1rem; color: #D4AF37; font-weight: bold; display: inline-block; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050507; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="relative">

    <div class="ambient-light bg-brand-gold/10 w-[400px] h-[400px] md:w-[600px] md:h-[600px] top-[-100px] left-[-100px]"></div>

    <nav class="fixed w-full z-50 glass-nav h-20 flex items-center">
        <div class="max-w-7xl mx-auto px-4 md:px-6 w-full flex justify-between items-center">
            <button onclick="scrollToSection('hero')" class="text-xl md:text-2xl font-black text-brand-gold tracking-widest outline-none">KOLKHA</button>
            
            <div class="hidden md:flex gap-8 items-center text-sm font-semibold text-gray-300">
                <button onclick="scrollToSection('hero')" class="hover:text-brand-gold transition outline-none">მთავარი</button>
                <button onclick="scrollToSection('menuSection')" class="hover:text-brand-gold transition outline-none">მენიუ</button>
                <button onclick="scrollToSection('contactSection')" class="hover:text-brand-gold transition outline-none">კონტაქტი</button>
            </div>

            <div class="flex items-center gap-3">
                <div id="headerActions"></div>
            </div>
        </div>
    </nav>

    <section id="hero" class="hero-parallax min-h-[85vh] md:min-h-[90vh] flex flex-col justify-center items-center text-center pt-24 px-4">
        <h1 class="text-3xl sm:text-5xl md:text-7xl font-black text-white mb-6 leading-tight drop-shadow-2xl">
            გემო, რომელიც <br/>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-gold to-yellow-200">ისტორიას ჰყვება</span>
        </h1>
        <p class="text-gray-300 max-w-xl mb-8 text-base md:text-lg">პრემიუმ კლასის რესტორანი ხობში.</p>
        <button onclick="scrollToSection('menuSection')" class="px-7 py-3 md:px-8 md:py-3.5 rounded-full btn-gold font-bold text-sm md:text-base">მენიუს ნახვა</button>
    </section>

    <div class="marquee w-full relative z-10">
        <div class="marquee-content">
            <span class="marquee-item">ელარჯი & ხარჩო <span class="mx-3 text-gray-600">✦</span></span>
            <span class="marquee-item">მეგრული კუპატი <span class="mx-3 text-gray-600">✦</span></span>
            <span class="marquee-item">ნადუღი პიტნით <span class="mx-3 text-gray-600">✦</span></span>
            <span class="marquee-item">გებჟალია <span class="mx-3 text-gray-600">✦</span></span>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 md:px-6 py-12 md:py-20 w-full">
        
        <section id="bossDashboard" class="hidden mb-16 space-y-6">
            </section>

        <section id="menuSection" class="pt-6 scroll-mt-20">
            <div class="flex items-center justify-between mb-8 border-b border-white/10 pb-4">
                <h2 class="text-2xl md:text-3xl font-black text-white">ჩვენი <span class="text-brand-gold">მენიუ</span></h2>
            </div>
            <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"></div>
        </section>

    </main>

    <footer id="contactSection" class="glass-panel border-t border-white/5 py-10 text-center mt-10 px-4">
        <h2 class="text-xl md:text-2xl font-black text-white mb-4">დაჯავშნე მაგიდა</h2>
        <a href="tel:568222290" class="inline-block px-7 py-3 rounded-full bg-brand-gold/10 text-brand-gold font-bold text-base md:text-lg border border-brand-gold/30 hover:bg-brand-gold hover:text-black transition">
            <i class="fa-solid fa-phone mr-2"></i> 568 22 22 90
        </a>
        <p class="text-gray-500 mt-6 text-xs md:text-sm">8W93+877, ხობი. &copy; 2026 Kolkha.</p>
    </footer>

    <div id="authModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
        <div class="glass-panel w-full max-w-sm p-6 md:p-8 rounded-3xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition text-xl outline-none"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-xl md:text-2xl font-bold text-center text-white mb-6">ბოსის ავტორიზაცია</h3>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <input type="text" id="username" placeholder="მომხმარებლის სახელი" class="w-full px-4 py-3 rounded-xl bg-black/50 border border-white/10 focus:border-brand-gold text-white outline-none text-sm" required>
                <input type="password" id="password" placeholder="პაროლი" class="w-full px-4 py-3 rounded-xl bg-black/50 border border-white/10 focus:border-brand-gold text-white outline-none text-sm" required>
                <button type="submit" class="w-full py-3.5 rounded-xl btn-gold font-bold mt-2 text-sm">შესვლა</button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfkKYar0IrnbGzxno5hkqCSua5YjYA9XM",
            authDomain: "maizeri-82faa.firebaseapp.com",
            databaseURL: "https://maizeri-82faa-default-rtdb.firebaseio.com",
            projectId: "maizeri-82faa",
            storageBucket: "maizeri-82faa.firebasestorage.app",
            messagingSenderId: "60863703942",
            appId: "1:60863703942:web:73ce134d30a6d408f11a07",
            measurementId: "G-0PMWQ17C0W"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let menuData = [];
        let visitorLogs = [];
        let isBossLoggedIn = JSON.parse(localStorage.getItem('kolkha_boss_auth')) || false;

        function scrollToSection(id) { document.getElementById(id).scrollIntoView({ behavior: 'smooth' }); }

        async function trackVisitorIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                db.ref('logs').push({
                    ip: data.ip,
                    time: new Date().toLocaleString('ka-GE'),
                    timestamp: Date.now()
                });
            } catch (error) {
                console.log("IP ვერ დაფიქსირდა");
            }
        }

        function listenToDatabase() {
            db.ref('menu').on('value', (snapshot) => {
                const data = snapshot.val();
                menuData = data ? Object.entries(data).map(([key, val]) => ({ key, ...val })) : [];
                renderMenu();
            });

            db.ref('logs').orderByChild('timestamp').limitToLast(50).on('value', (snapshot) => {
                const data = snapshot.val();
                visitorLogs = data ? Object.values(data).reverse() : [];
                if (isBossLoggedIn) renderBossDashboard();
            });
        }

        function init() {
            renderHeader();
            if (isBossLoggedIn) renderBossDashboard();
            
            if(!sessionStorage.getItem('kolkha_ip_tracked')) {
                trackVisitorIP();
                sessionStorage.setItem('kolkha_ip_tracked', 'true');
            }
            listenToDatabase();
        }

        function renderHeader() {
            const headerActions = document.getElementById('headerActions');
            if (isBossLoggedIn) {
                headerActions.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-white hidden sm:inline-block">ბოსი <span class="text-red-500">🔴</span></span>
                        <button onclick="logout()" class="w-9 h-9 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition outline-none" title="გასვლა"><i class="fa-solid fa-power-off text-xs"></i></button>
                    </div>`;
            } else {
                headerActions.innerHTML = `<button onclick="openModal()" class="px-4 py-1.5 md:px-5 md:py-2 rounded-full border border-brand-gold/50 text-brand-gold font-semibold text-xs md:text-sm hover:bg-brand-gold hover:text-black transition outline-none">შესვლა</button>`;
            }
        }

        function renderBossDashboard() {
            const dash = document.getElementById('bossDashboard');
            if (!isBossLoggedIn) { dash.classList.add('hidden'); return; }
            dash.classList.remove('hidden');

            let logsHtml = visitorLogs.map((log, index) => `
                <div class="flex justify-between items-center p-2.5 border-b border-white/5 text-xs md:text-sm ${index === 0 ? 'bg-brand-gold/10 rounded' : ''}">
                    <span class="text-gray-200 font-mono truncate max-w-[140px] sm:max-w-none"><i class="fa-solid fa-laptop text-xs text-brand-gold mr-1.5"></i> ${log.ip}</span>
                    <span class="text-gray-400 text-[10px] md:text-xs">${log.time}</span>
                </div>
            `).join('');

            dash.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="glass-panel p-5 md:p-8 rounded-3xl border border-brand-gold/25">
                        <h3 class="text-lg md:text-xl font-bold text-brand-gold mb-4"><i class="fa-solid fa-utensils mr-2"></i> კერძის დამატება</h3>
                        <form onsubmit="addMenuItem(event)" class="flex flex-col gap-3.5">
                            <input type="text" id="newName" placeholder="კერძის სახელი" class="px-4 py-3 rounded-xl bg-black/50 border border-white/10 text-white outline-none focus:border-brand-gold text-sm" required>
                            <input type="text" id="newPrice" placeholder="ფასი (მაგ: 15 ₾)" class="px-4 py-3 rounded-xl bg-black/50 border border-white/10 text-white outline-none focus:border-brand-gold text-sm" required>
                            <input type="text" id="newDesc" placeholder="აღწერა..." class="px-4 py-3 rounded-xl bg-black/50 border border-white/10 text-white outline-none focus:border-brand-gold text-sm" required>
                            <button type="submit" class="py-3.5 rounded-xl btn-gold font-bold outline-none text-sm hover:brightness-110">მენიუში დამატება</button>
                        </form>
                        <button onclick="clearMenu()" class="w-full mt-5 py-3 rounded-xl border border-red-500/40 text-red-400 font-bold text-xs md:text-sm hover:bg-red-500/20 transition outline-none">
                            <i class="fa-solid fa-trash mr-2"></i> მთლიანი მენიუს წაშლა
                        </button>
                    </div>

                    <div class="glass-panel p-5 md:p-8 rounded-3xl border border-brand-gold/25 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-lg md:text-xl font-bold text-brand-gold"><i class="fa-solid fa-network-wired mr-2"></i> ვიზიტორების IP მისამართები</h3>
                                <button onclick="clearLogs()" class="text-xs text-red-400 hover:underline outline-none">ისტორიის წაშლა</button>
                            </div>
                            <div class="max-h-60 overflow-y-auto pr-1 bg-black/40 rounded-xl p-3 border border-white/5 space-y-1.5">
                                ${logsHtml || '<p class="text-xs text-gray-500 text-center py-6">ვიზიტები ჯერ არ არის.</p>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            if (menuData.length === 0) { grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">მენიუ ცარიელია.</p>`; return; }

            menuData.forEach(item => {
                let deleteBtn = isBossLoggedIn ? `<button type="button" onclick="deleteItem('${item.key}')" class="mt-4 w-full py-2.5 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/30 transition outline-none text-xs md:text-sm font-bold">წაშლა</button>` : '';
                grid.innerHTML += `
                    <div class="glass-panel p-5 md:p-6 rounded-2xl group transition hover:border-brand-gold/30 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2.5">
                                <h3 class="text-base md:text-lg font-bold text-white group-hover:text-brand-gold transition">${item.name}</h3>
                                <span class="bg-brand-gold/20 text-brand-gold px-2.5 py-1 rounded-lg text-xs md:text-sm font-bold whitespace-nowrap ml-2">${item.price}</span>
                            </div>
                            <p class="text-gray-400 text-xs md:text-sm mb-4 leading-relaxed">${item.desc}</p>
                        </div>
                        <div>
                            <a href="tel:568222290" class="block text-center w-full py-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition outline-none text-xs md:text-sm font-semibold"><i class="fa-solid fa-phone mr-1.5"></i> შეკვეთა</a>
                            ${deleteBtn}
                        </div>
                    </div>
                `;
            });
        }

        function openModal() { document.getElementById('authModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('authModal').classList.add('hidden'); document.getElementById('loginForm').reset(); }
        document.getElementById('authModal').addEventListener('click', (e) => { if (e.target.id === 'authModal') closeModal(); });

        function handleLogin(e) {
            e.preventDefault(); 
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            if (u === 'jano27' && p === 'januka27') {
                isBossLoggedIn = true;
                localStorage.setItem('kolkha_boss_auth', JSON.stringify(true));
                closeModal();
                renderHeader();
                renderBossDashboard();
                renderMenu();
            } else {
                alert('წვდომა უარყოფილია!');
            }
        }

        function logout() { 
            isBossLoggedIn = false; 
            localStorage.removeItem('kolkha_boss_auth'); 
            renderHeader();
            document.getElementById('bossDashboard').classList.add('hidden');
            renderMenu();
        }

        function addMenuItem(e) {
            e.preventDefault(); 
            db.ref('menu').push({
                name: document.getElementById('newName').value,
                price: document.getElementById('newPrice').value,
                desc: document.getElementById('newDesc').value,
                timestamp: Date.now()
            });
            e.target.reset();
        }

        function deleteItem(key) {
            if(confirm('ნამდვილად გსურთ წაშლა?')) {
                db.ref(`menu/${key}`).remove();
            }
        }

        function clearMenu() {
            if(confirm('ნამდვილად გსურთ მთლიანი მენიუს წაშლა?')) {
                db.ref('menu').remove();
            }
        }

        function clearLogs() {
            if(confirm('ნამდვილად გსურთ ისტორიის წაშლა?')) {
                db.ref('logs').remove();
            }
        }

        init();
    </script>
</body>
</html>
